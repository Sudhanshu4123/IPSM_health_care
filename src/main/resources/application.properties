spring.application.name=healthcare
server.port=8083

# Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/ipsm_healthcare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Safe Hibernate Settings (No data/schema change)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
