<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HealthCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2rem;
            color: #1e3a8a;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .logo i {
            color: #b91c1c;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-control {
            width: 100%;
            height: 40px;
            padding: 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        .input-control:focus {
            border-color: #b71677;
            box-shadow: 0 0 0 2px rgba(183, 22, 119, 0.1);
        }

        .btn-primary {
            width: 100%;
            height: 45px;
            background-color: #b71677;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #9d1266;
        }

        .error-message {
            color: #b91c1c;
            background-color: #fee2e2;
            border: 1px solid #f87171;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fa-solid fa-stethoscope"></i>
            </div>
            <p style="color: #64748b; margin: 0; font-size: 0.95rem;">Sign in to access the system</p>
        </div>

        <div id="error-msg" class="error-message">
            Invalid username or password.
        </div>
        <div id="logout-msg" class="error-message"
            style="color: #15803d; background-color: #dcfce7; border-color: #86efac;">
            You have been logged out successfully.
        </div>

        <form action="/login" method="POST">
            <div class="field-group">
                <label class="field-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="input-control" placeholder="Enter your username"
                    required>
            </div>

            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="input-control"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary">Login</button>
        </form>

        <div class="footer-text">
            &copy; 2026 SOLICITOUS WELLNESS PVT LTD.
        </div>


    </div>

    <script>
        // Check URL parameters for error or logout messages
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('error-msg').style.display = 'block';
        }
        if (urlParams.has('logout')) {
            document.getElementById('logout-msg').style.display = 'block';
        }
    </script>
</body>

</html>
